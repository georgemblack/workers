<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · idp.george.black</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav>
      <div class="brand">idp.george.black</div>
      <div class="links">
        <a href="/.well-known/openid-configuration" target="_blank">Discovery</a>
        <a href="#" id="logout-link">Sign out</a>
      </div>
    </nav>

    <main>
      <section>
        <div class="toolbar">
          <h2 style="margin: 0">OIDC Clients</h2>
          <button id="new-client-btn" class="sm">New client</button>
        </div>
        <table id="clients-table" class="expandable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Client ID</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="clients-body"></tbody>
        </table>

        <div
          id="new-client-form"
          hidden
          style="margin-top: 1.5rem; border-top: 1px solid var(--hairline); padding-top: 1.5rem"
        >
          <h2 style="margin-top: 0">Register new client</h2>
          <div class="field">
            <label>Type</label>
            <div class="segmented">
              <label
                ><input type="radio" name="client-kind" value="access" checked />Cloudflare
                Access</label
              >
              <label><input type="radio" name="client-kind" value="other" />Other app</label>
            </div>
          </div>
          <div class="field">
            <label>Name</label>
            <input id="client-name" type="text" placeholder="e.g. linkmgr" />
          </div>
          <div class="field">
            <label>Email</label>
            <input id="client-email" type="email" placeholder="you@example.com" />
          </div>
          <div class="field" data-for="access">
            <label>Access team names (one per line)</label>
            <textarea id="client-auth-domains" placeholder="george"></textarea>
          </div>
          <div class="field" data-for="other" hidden>
            <label>Redirect URIs (one per line)</label>
            <textarea id="client-redirects" placeholder="https://example.com/callback"></textarea>
          </div>
          <div class="field" data-for="other" hidden>
            <label>Post-logout redirect URIs (one per line, optional)</label>
            <textarea id="client-logout-redirects" placeholder="https://example.com/"></textarea>
          </div>
          <div class="field">
            <label>Token endpoint auth method</label>
            <select id="client-auth-method">
              <option value="client_secret_basic">client_secret_basic (confidential)</option>
              <option value="client_secret_post">client_secret_post</option>
              <option value="none">none (public + PKCE)</option>
            </select>
          </div>
          <div class="row">
            <button id="save-client-btn" style="width: auto">Create</button>
            <button id="cancel-client-btn" class="secondary" style="width: auto">Cancel</button>
          </div>
          <div id="new-client-result" class="status" style="margin-top: 1rem"></div>
        </div>
      </section>

      <section>
        <div class="toolbar" style="margin-top: 2rem">
          <h2 style="margin: 0">Passkeys</h2>
          <button id="add-passkey-btn" class="sm">Add passkey</button>
        </div>
        <table id="creds-table">
          <thead>
            <tr>
              <th>Label</th>
              <th>Type</th>
              <th>Created</th>
              <th>Last used</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="creds-body"></tbody>
        </table>
      </section>

      <div id="status" class="status"></div>
    </main>

    <script type="module">
      import { register, logout, showStatus, clearStatus } from "/webauthn.js";

      const status = document.getElementById("status");

      async function requireAuth() {
        const r = await fetch("/api/auth/state").then((r) => r.json());
        if (!r.authenticated) {
          location.replace("/login?next=/admin");
          throw new Error("not authenticated");
        }
      }

      async function loadClients() {
        const r = await fetch("/api/admin/clients").then((r) => r.json());
        const tbody = document.getElementById("clients-body");
        tbody.innerHTML = "";
        // Fill in the default email, unless something was already typed.
        const emailInput = document.getElementById("client-email");
        if (!emailInput.value) emailInput.value = r.default_email ?? "";
        const codeList = (urls) =>
          urls.length
            ? urls.map((u) => `<div><code>${escape(u)}</code></div>`).join("")
            : `<span class="subtle">None</span>`;
        for (const c of r.clients) {
          // Older clients have no email and get the default one.
          const email = c.email
            ? escape(c.email)
            : `${escape(r.default_email)} <span class="subtle">(default)</span>`;

          // A short summary row, plus a hidden row with everything else that
          // opens when the summary row is clicked.
          const row = document.createElement("tr");
          row.className = "client-row";
          row.innerHTML = `
            <td><button class="row-toggle" aria-expanded="false">${escape(c.name)}</button></td>
            <td><code>${escape(c.client_id)}</code></td>
            <td>${email}</td>
          `;
          const details = document.createElement("tr");
          details.className = "client-details";
          details.hidden = true;
          details.innerHTML = `
            <td colspan="3">
              <dl>
                <dt class="narrow-only">Client ID</dt>
                <dd class="narrow-only"><code>${escape(c.client_id)}</code></dd>
                <dt>Redirect URIs</dt>
                <dd>${codeList(c.redirect_uris)}</dd>
                <dt>Post-logout redirect URIs</dt>
                <dd>${codeList(c.post_logout_redirect_uris)}</dd>
                <dt>Auth method</dt>
                <dd>${escape(c.token_endpoint_auth_method)}</dd>
                <dt>Client secret</dt>
                <dd>${c.has_secret ? "Set (shown only when created)" : "None (public client)"}</dd>
                <dt>Created</dt>
                <dd>${escape(c.created_at)}</dd>
              </dl>
              <button class="danger" data-id="${escape(c.client_id)}">Delete client</button>
            </td>
          `;
          row.addEventListener("click", () => {
            details.hidden = !details.hidden;
            row.querySelector(".row-toggle").setAttribute("aria-expanded", String(!details.hidden));
          });
          tbody.append(row, details);
        }
        tbody.querySelectorAll("button.danger").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm(`Delete client ${btn.dataset.id}?`)) return;
            await fetch(`/api/admin/clients/${btn.dataset.id}`, {
              method: "DELETE",
            });
            await loadClients();
          });
        });
      }

      async function loadCredentials() {
        const r = await fetch("/api/credentials").then((r) => r.json());
        const tbody = document.getElementById("creds-body");
        tbody.innerHTML = "";
        for (const c of r.credentials) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${escape(c.label || "(unlabeled)")}</td>
            <td>${escape(c.device_type)}${c.backed_up ? " · synced" : ""}</td>
            <td>${escape(c.created_at)}</td>
            <td>${escape(c.last_used_at || "—")}</td>
            <td><button class="danger" data-id="${escape(c.credential_id)}">Delete</button></td>
          `;
          tbody.appendChild(tr);
        }
        tbody.querySelectorAll("button.danger").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Delete this passkey?")) return;
            const resp = await fetch(`/api/credentials/${encodeURIComponent(btn.dataset.id)}`, {
              method: "DELETE",
            });
            if (!resp.ok) {
              const err = await resp.json();
              showStatus(status, `Delete failed: ${err.error}`, "error");
              return;
            }
            await loadCredentials();
          });
        });
      }

      function escape(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }

      // Wire up "new client" form
      const newClientForm = document.getElementById("new-client-form");
      document.getElementById("new-client-btn").addEventListener("click", () => {
        newClientForm.hidden = false;
      });
      document.getElementById("cancel-client-btn").addEventListener("click", () => {
        newClientForm.hidden = true;
      });
      // Client type switch. Access clients only need team names; other apps
      // need full redirect URIs.
      const clientKind = () => newClientForm.querySelector("[name=client-kind]:checked").value;
      newClientForm.querySelector(".segmented").addEventListener("change", () => {
        newClientForm.querySelectorAll("[data-for]").forEach((el) => {
          el.hidden = el.dataset.for !== clientKind();
        });
      });

      function lines(id) {
        return document
          .getElementById(id)
          .value.split("\n")
          .map((s) => s.trim())
          .filter(Boolean);
      }

      // Accepts "george", "george.cloudflareaccess.com" or a full URL.
      function accessCallback(team) {
        const name = team
          .replace(/^https?:\/\//, "")
          .split("/")[0]
          .replace(/\.cloudflareaccess\.com$/, "");
        return `https://${name}.cloudflareaccess.com/cdn-cgi/access/callback`;
      }

      document.getElementById("save-client-btn").addEventListener("click", async () => {
        const name = document.getElementById("client-name").value.trim();
        const email = document.getElementById("client-email").value.trim();
        const method = document.getElementById("client-auth-method").value;
        const isAccess = clientKind() === "access";
        const redirects = isAccess
          ? lines("client-auth-domains").map(accessCallback)
          : lines("client-redirects");
        const logoutRedirects = isAccess ? [] : lines("client-logout-redirects");

        const resultEl = document.getElementById("new-client-result");
        resultEl.className = "status";
        if (!name || !email || redirects.length === 0) {
          const what = isAccess ? "team name" : "redirect URI";
          showStatus(resultEl, `Name, email and at least one ${what} required.`, "error");
          return;
        }
        const resp = await fetch("/api/admin/clients", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name,
            redirect_uris: redirects,
            post_logout_redirect_uris: logoutRedirects,
            token_endpoint_auth_method: method,
            email,
          }),
        });
        const body = await resp.json();
        if (!resp.ok) {
          showStatus(resultEl, body.error || "create failed", "error");
          return;
        }
        let html = `Client created.<br>client_id: <code>${escape(body.client_id)}</code>`;
        if (body.client_secret) {
          html += `<br>client_secret: <code>${escape(body.client_secret)}</code><br><strong>Save this — it will not be shown again.</strong>`;
        }
        const origin = location.origin;
        if (isAccess) {
          html += `<br><br>Auth URL: <code>${origin}/authorize</code>`;
          html += `<br>Token URL: <code>${origin}/token</code>`;
          html += `<br>Certificate URL: <code>${origin}/.well-known/jwks.json</code>`;
        } else {
          html += `<br><br>Issuer: <code>${origin}</code>`;
          html += `<br>Discovery URL: <code>${origin}/.well-known/openid-configuration</code>`;
          html += `<br>The app must support PKCE (S256).`;
        }
        resultEl.innerHTML = html;
        resultEl.className = "status show success";
        await loadClients();
      });

      // Add passkey
      document.getElementById("add-passkey-btn").addEventListener("click", async () => {
        const label = prompt("Label for the new passkey?") || undefined;
        try {
          await register({ label });
          await loadCredentials();
          showStatus(status, "Passkey added.", "success");
        } catch (e) {
          showStatus(status, `Failed: ${e.message}`, "error");
        }
      });

      // Logout
      document.getElementById("logout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        await logout();
        location.replace("/login");
      });

      (async () => {
        await requireAuth();
        await loadClients();
        await loadCredentials();
      })();
    </script>
  </body>
</html>
